<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ViceNet</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#14121a;--s:#1d1925;--s2:#251f2f;--ln:#372f43;--tx:#f4ece3;--mu:#a69cae;--co:#ff7a59;--la:#35c9b6;--go:#f5b83d;--rd:#f0476c;--disp:"Anton","Bebas Neue",Impact,"Arial Narrow",sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:inherit}html{color-scheme:dark}
body{margin:0;color:var(--tx);font:15.5px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;background:radial-gradient(900px 420px at 85% -6%,#ff7a5930,transparent 70%),radial-gradient(700px 380px at 0% 0%,#35c9b61f,transparent 70%),linear-gradient(180deg,#241b2d 0,#14121a 340px) fixed,var(--bg)}
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:14px 20px 12px;border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--co),var(--go),var(--la)) 1}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}h1{margin:0;font:400 32px/1 var(--disp);letter-spacing:.07em;text-shadow:0 0 22px #ff7a5960}h1 span{color:var(--co)}
small,.lab{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.gd{display:flex;align-items:center;gap:8px}.pg{flex:1;min-width:150px}.bar{height:4px;background:var(--ln);margin-top:5px;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--la)}
nav{display:flex;gap:24px;overflow-x:auto;padding:0 20px;border-bottom:1px solid var(--ln)}
nav button{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;color:var(--mu);padding:12px 0 9px;font:400 17px var(--disp);letter-spacing:.07em;text-transform:uppercase}nav button.on{color:var(--tx);border-color:var(--co)}
main{padding:20px 20px 60px;max-width:1040px;margin:auto}
button,select,input,textarea{background:var(--s2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px 12px;font:inherit;min-height:42px}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--mu)}button:disabled{opacity:.35;cursor:default}
button.pri{background:var(--co);border-color:var(--co);color:#1d0e09;font-weight:700}button.x{color:var(--rd)}
:focus-visible{outline:2px solid var(--go);outline-offset:1px}
section{margin:0 0 30px}h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:.05em;text-transform:uppercase;margin:0}
h3{margin:0 0 14px;font-size:22px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}h3 span{font:400 13px "DM Sans",sans-serif;letter-spacing:0;text-transform:none;color:var(--mu)}
small,.n{font-variant-numeric:tabular-nums}small,.lab{display:inline-block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>input,.row>select{flex:1;min-width:130px}.cell{flex:1;min-width:120px}.mu{color:var(--mu)}.n{font-family:var(--mono)}.alt{color:var(--rd)}
.blur{filter:blur(7px);user-select:none}.done .mt b{text-decoration:line-through;opacity:.55}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--la);margin-top:3px}
.ib{padding:0;width:36px;height:36px;min-height:0;display:grid;place-items:center;background:none;border-color:transparent;color:var(--mu)}
.here{margin:0 0 18px;padding:18px;border-radius:14px;background:linear-gradient(135deg,#ff7a5928,#f5b83d14 55%,#35c9b620);border:1px solid #ff7a5960}.here h2{margin:4px 0 4px;font-size:32px;line-height:1.05;color:var(--go)}.here p{margin:0 0 12px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--ln);border-radius:12px;overflow:hidden;margin-bottom:12px}.sum>div{background:var(--s);padding:12px 14px}.sum b{display:block;font:700 20px var(--mono)}.sum>div:first-child b{color:var(--la)}.sum>div:last-child b{color:var(--go)}
.segs{display:flex;gap:4px;margin-bottom:20px}.sb{position:relative;height:24px;background:var(--s2);overflow:hidden;border-radius:4px}.sb i{position:absolute;inset:0 auto 0 0;background:var(--la);opacity:.5}.sb small{position:relative;padding-left:8px;line-height:24px}
.chh{display:flex;align-items:baseline;gap:12px;padding:6px 0 8px;border-bottom:2px solid var(--go);margin-top:28px}.chh h2{font-size:25px;flex:1;line-height:1.1}.chh .n{font-size:12px}
.mr,.lr{display:grid;grid-template-columns:24px 1fr 36px;gap:6px 12px;align-items:start;padding:13px 0 13px 10px;border-bottom:1px solid var(--ln);border-left:3px solid transparent}
.mr.nr{border-left-color:var(--rd);background:linear-gradient(90deg,#f0476c14,transparent 60%)}.mt b{font-weight:700}.mt p{margin:2px 0 0;color:var(--mu);font-size:13.5px}.nrt{display:inline-flex;gap:4px;align-items:center;margin-left:10px;font:700 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--rd);vertical-align:1px}
.mm{grid-column:2;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;font-size:13px}.mm .imp{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}.k .imp{color:var(--go)}.mm u{text-decoration:none;color:var(--mu);margin-left:3px;font-size:11px}
.lr>input[type=checkbox]{grid-column:1;grid-row:1}.lr>.ib{grid-column:3;grid-row:1}.lr>.f{grid-column:2}.f{display:block}.f small{display:block;margin-bottom:3px}.f input,.f select{width:100%}.lh{display:none}
.bal{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:1px;background:var(--ln);border-radius:12px;overflow:hidden;margin-bottom:20px;box-shadow:0 8px 24px #0008}.bal>div{background:var(--s);padding:10px 14px}.bal b{display:block;font:700 18px var(--mono)}.bal>div:first-child b{color:var(--la)}.bal .net b{font-size:26px;color:var(--go)}.bal .net b.alt{color:var(--rd)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.seg2{display:inline-flex}.seg2 button{border-radius:0;margin-left:-1px}.seg2 button:first-child{border-radius:8px 0 0 8px;margin:0}.seg2 button:last-child{border-radius:0 8px 8px 0}.seg2 button.on{border-color:var(--co);color:var(--co);z-index:1;position:relative}
.strip{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;padding:12px 14px;background:var(--s);border:1px solid var(--ln);border-bottom:0;border-radius:12px 12px 0 0}.strip b{display:block;font:700 16px var(--mono);color:var(--go)}.grow{flex:1;min-width:200px}.grow input{width:100%}
.key{width:100%;font-size:13px}.key summary{cursor:pointer;color:var(--mu);font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase}.key input{width:100%;margin:8px 0}
.qp{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--s);border:1px solid var(--ln);border-bottom:0}.qp button{white-space:nowrap;background:none;font-size:13px;color:var(--mu);border-radius:99px}
.feed{height:46vh;overflow:auto;padding:14px;background:#0f0d15;border:1px solid var(--ln);border-radius:0 0 12px 12px;font-size:15px}.ln{display:grid;grid-template-columns:58px 1fr;gap:8px;margin:0 0 14px}.ln p{margin:0;white-space:pre-wrap}.who{font:500 10.5px var(--mono);letter-spacing:.14em;color:var(--mu);padding-top:4px}.ln.t .who{color:var(--co)}.ln.t p{color:#ffe9dc}
.send{display:flex;gap:8px;position:sticky;bottom:0;padding:10px 0;background:var(--bg)}.send input{flex:1}
.two{display:grid;gap:28px;grid-template-columns:1fr}.big{font-size:44px;font-weight:700;color:var(--go);margin-bottom:10px}
.dl{display:grid;grid-template-columns:1fr auto;margin:16px 0 10px;border-top:1px solid var(--ln)}.dl dt,.dl dd{margin:0;padding:8px 0;border-bottom:1px solid var(--ln)}.dl dd{text-align:right}.dl em{display:block;font:normal 500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.pbar{height:6px;background:var(--ln);margin-bottom:8px;border-radius:3px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--la)}
.steps{margin:0;padding-left:24px}.steps li{padding:7px 0;border-bottom:1px solid var(--ln)}.steps li::marker{color:var(--co);font:700 13px var(--mono)}
.nl{display:grid;grid-template-columns:130px 1fr 36px;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--ln)}.danger{margin-top:18px;padding-top:14px;border-top:1px solid var(--ln)}.empty{padding:22px 4px;color:var(--mu);font-style:italic}
#md{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}#md>div{background:var(--s);border:1px solid var(--ln);border-top:3px solid var(--co);border-radius:12px;padding:18px;width:100%;max-width:480px;max-height:90vh;overflow:auto}#md label{display:block;margin:10px 0 3px;color:var(--mu);font-size:12px}#md input:not([type=checkbox]),#md select,#md textarea{width:100%}
@media(min-width:820px){.two{grid-template-columns:1fr 1fr}.mr{grid-template-columns:24px 1fr 290px 36px;align-items:center}.mm{grid-column:auto}
.lr>*{grid-column:auto!important;grid-row:auto!important}.lr{align-items:center}.f small{display:none}.lr,.lh{grid-template-columns:24px 1.5fr 120px 120px 1fr 1.6fr 36px}.lr.g-c,.lh.g-c{grid-template-columns:24px 1.4fr 150px 1.6fr 36px}.lr.g-h,.lh.g-h{grid-template-columns:24px 1.3fr 1fr 1.6fr 110px 130px 36px}
.lh{display:grid;gap:12px;padding:6px 0 6px 10px;border-bottom:2px solid var(--go)}}
</style></head><body>
<header class="top"><div class="brand"><h1>VICE<span>NET</span></h1><small>Leonida crew companion</small></div><label class="gd"><small>Spoiler Guard</small><select id="sg"></select></label><div class="pg"><small id="pt"></small><div class="bar"><i id="pb"></i></div></div></header>
<nav id="nav"></nav><main id="v"></main><div id="md"><div id="mb"></div></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IMP=['Unrated','Critical / Turning Point','Major Plot','Character & World','Side / Optional'];
const WHY=['','Turning point: a big set piece or a major shift for the crew.','Major plot: moves the main story and opens up new contacts, places or jobs.','Character & world: builds relationships and the setting; light plot weight.','Optional feel: low plot impact, fine to enjoy at your own pace.'];
const FIN='Chapter finale and a point of no return: the next chapter changes the map and contacts. Finish side activities, collectibles and shopping first, then save.';
// Titles from published guides. Times, importance and flags are estimates: casual minutes (speedrun = ~60%), edit them in the mission editor.
const D={1:'Prologue~15~2|Gone Fishing~35~3|Gear Up~30~3|Just A Scratch~40~3|Lab Fees~40~2|Unwanted Attention~35~2|Pipework~40~3|Hey Arnold!~30~3|Island Dreams~35~3|Feng Shui~35~3|Coming Home~30~1|Buck Me~40~2|Clean Up After Donnie~40~3|Down to Earth~30~3|Clear Skies~45~2|Day Release~35~3|Swamped~40~3|Mission 18 (title hidden by source)~40~2|Recalibration~35~3|Tourist Trap~45~2|Home Sweet Home~40~2|Discharge Time~55~1!',
2:'What’s in the Bag?~35~3|Ambulance Chaser~40~2|Just Moved In~25~3|Girls’ Trip~40~3|Moses~35~3|Daily Driver~30~3|Slam Dunk~30~4|Breakfast Run~25~4|Coffee Break~30~3|Afternoon Delight~40~2|Checking Out~55~1!',
3:'Welcome to Vice City~40~1|Dealer’s Choice~45~2|Meet the Heders~40~3|Dubious Provenance~45~3|Mami Knows Best~40~3|South Leonida Estate~40~3|Tyrone~35~3|Here, Kitty Kitty~40~3|Car Services~35~3|Top Billing~40~3|Boobie Time~35~4|First Impressions~40~3|Caught Slipping~45~2|Crosstown Traffic~40~3|Credit Check~40~3|Steal the Zorruso for Randy~35~4|Sinfrontera National Bank~75~1|Security Expert~45~3|Ride or Die~50~2|Company Property~45~2|The Missing Link~45~2|Safe Word~45~2|Cooties~35~3|Bricked Up~50~2|Hidden Charges~50~2|The Cartel Heist~90~1!',
4:'Ocean Beach~40~2|Another Life~35~3|Company Cars~40~3|Lawyer Up~35~3|Party Hard~40~3|Heavy Lifting~40~3|Photo/Shoot~35~4|Making Gainz~30~4|Watch It~40~3|Cash Injections~45~3|Amateur Hour~40~3|Dirty Work~45~3|Too Much Baggage~45~3|Adventures in Babysitting~40~3|Fresh Evidence~45~2|Power Play~50~2|Child’s Play~45~3|Headliners~50~2|Close Surveillance~45~3|Delivery Method~45~3|Team Building~45~2|Fully Catered~50~3|VCIA Takedown~60~1|Sunset~60~1|Mission 25 (title hidden by source)~70~1!',
5:'Bird in the Hand~45~2|Taking Liberties~45~2|VC Baby~50~2|Doggie Bag~45~2|Operation Savage Glory~70~1|Protective Custody~60~1|Finale (title hidden by source)~80~1!'};
const seed=()=>{let id=0,o=[];for(const c in D)D[c].split('|').forEach(s=>{let f=s.endsWith('!');if(f)s=s.slice(0,-1);const[t,m,i]=s.split('~');o.push({id:id++,c:+c,t,ca:+m,sp:Math.round(m*.6),imp:+i,why:f?FIN:WHY[i],mis:f?1:0})});return o};
const G0=()=>[['Starter ride (template)','None','Wherever you start','Flip or keep?','Check for tracker before committing'],['High-value untracked ride (template)','None','Log where you spot it','Keeper','Save an early free registration slot for this, not a junker'],['Junker (template)','Standard','Anywhere','Quick flip','Skip registration; chop-shop or scrub if you need cash'],['Off-road / trunk-space pick (template)','Advanced','Log it','Keeper?','Trade-off: trunk room vs off-road ability']].map(r=>({v:r,d:0}));
const C0=()=>[['Starting cash (edit me)','0','Set your real number'],['Motel tab (edit me)','-0','Rent or tab owed'],['Goal: first good ride','-0','Target amount']].map(r=>({v:r,d:0}));
const H0=()=>[['Tier 1: street / gang ops','Quick score','Nothing special','Low','Small, steady'],['Tier 2: jewelry or store hit','Store','Gear, getaway ride','Medium','Medium'],['Tier 3: small bank','Bank','Tools, crew, cash buffer','High','Large'],['Tier 4: major vault','Vault','Story gate and prep missions','Very high','Biggest']].map(r=>({v:r,d:0}));
const fresh=(sg=2)=>{const m=seed(),done={};m.filter(x=>x.c==1).forEach(x=>done[x.id]=true);return{done,sg,tab:'Campaign',q:'',fc:0,fs:'all',m,g:G0(),c:C0(),h:H0(),n:[],T:{run:0,st:0,acc:0,tot:0},key:'',ctx:'Port Gellhorn, Starlet Motel, start of Chapter 2',chat:[],ver:2,gf:'all',cf:'all',cs:'new'}};
let S=fresh();
try{const r=JSON.parse(localStorage.getItem('vicenet2')||'null');if(r)S={...S,...r}}catch(e){}
const save=()=>{try{localStorage.setItem('vicenet2',JSON.stringify(S))}catch(e){}};
$('#sg').innerHTML=[1,2,3,4,5].map(i=>`<option value="${i}">Chapter ${i}</option>`).join('')+'<option value="9">All (unfiltered)</option>';
$('#sg').value=S.sg;$('#sg').onchange=e=>{S.sg=+e.target.value;go()};
const TABS=['Campaign','Tommy','Garage','Cash','Heists','Tools'];
const ic=p=>`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={ed:ic('<path d="M4 20h4L19 9l-4-4L4 16z"/>'),x:ic('<path d="M6 6l12 12M18 6L6 18"/>'),add:ic('<path d="M12 5v14M5 12h14"/>'),flag:ic('<path d="M5 21V4M5 5h12l-2 4 2 4H5"/>')};
const CT={1:'Just Like Paradise',2:'Paradise Lost',3:'Tits, Ass, Drug Money',4:'Vice City, Baby',5:'Top of the World, Ma'},hr=m=>(m/60).toFixed(1)+' h',LOC={1:'Jason’s side of Leonida',2:'Port Gellhorn',3:'Vice City',4:'Ocean Beach',5:'The last stretch'},LBL={Campaign:'Story',Tommy:'Tommy',Garage:'WAiNK',Cash:'BuckMe',Heists:'Scores',Tools:'Crew kit'};
function go(t){if(t)S.tab=t;save();$('#nav').innerHTML=TABS.map(x=>`<button class="${x==S.tab?'on':''}" onclick="go('${x}')">${LBL[x]}</button>`).join('');
const d=S.m.filter(m=>S.done[m.id]).length;$('#pb').style.width=(d/S.m.length*100)+'%';$('#pt').textContent=d+' / '+S.m.length+' missions done';
$('#v').innerHTML=V[S.tab]();if(S.tab=='Campaign')rl();if(S.tab=='Tommy'){const c=$('#chat');c.scrollTop=c.scrollHeight}}
const V={};
V.Campaign=()=>{const ca=S.m.reduce((a,m)=>a+m.ca,0),sp=S.m.reduce((a,m)=>a+m.sp,0),d=S.m.filter(m=>S.done[m.id]).length;
const cur=S.m.find(m=>!S.done[m.id]),hid=cur&&S.sg<9&&cur.c>S.sg;
return `${cur?`<div class="here"><small>You’re here</small><h2>Chapter ${cur.c} · ${CT[cur.c]}</h2><p>${LOC[cur.c]}. ${hid?'Raise your Spoiler Guard to see what’s next.':`Next up: <b>${E(cur.t)}</b>`}</p><button class="pri" onclick="S.fc=${cur.c};S.fs='all';S.q='';go()">Show Chapter ${cur.c}</button></div>`:'<div class="here"><h2>Story complete</h2><p>Every tracked mission is done. Leonida is yours.</p></div>'}<div class="sum"><div><small>Done</small><b>${d}/${S.m.length}</b></div><div><small>Casual</small><b>${hr(ca)}</b></div><div><small>Speedrun</small><b>${hr(sp)}</b></div><div><small>Saved</small><b>${hr(ca-sp)}</b></div></div>
<div class="segs">${[1,2,3,4,5].map(c=>{const a=S.m.filter(m=>m.c==c),p=a.length?a.filter(m=>S.done[m.id]).length/a.length*100:0;return `<div class="sb" style="flex:${a.reduce((x,m)=>x+m.ca,0)||1}"><i style="width:${p}%"></i><small>CH ${c}</small></div>`}).join('')}</div>
<div class="ctl"><input id="q" style="flex:1;min-width:160px" placeholder="Search missions" value="${E(S.q)}" oninput="S.q=this.value;rl()"><select onchange="S.fc=+this.value;rl()"><option value="0">All chapters</option>${[1,2,3,4,5].map(i=>`<option ${S.fc==i?'selected':''} value="${i}">Chapter ${i}</option>`).join('')}</select><select onchange="S.fs=this.value;rl()">${[['all','All'],['todo','To do'],['done','Done'],['miss','No-return flags'],['1','Critical'],['2','Major plot'],['3','Character & world'],['4','Optional']].map(x=>`<option value="${x[0]}" ${S.fs==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><button class="pri" onclick="om()">${I.add} Add</button></div><small class="mu" style="display:block">Titles from published guides. Times, importance and flags are estimates (speedrun is about 60% of casual): edit any mission.</small><div id="list"></div>`};
function rl(){const q=S.q.toLowerCase(),L=S.m.filter(m=>(!S.fc||m.c==S.fc)&&(!q||m.t.toLowerCase().includes(q))&&(S.fs=='all'||(S.fs=='done'?S.done[m.id]:S.fs=='todo'?!S.done[m.id]:S.fs=='miss'?m.mis:m.imp==S.fs))),o='';
for(const c of [1,2,3,4,5]){const A=L.filter(m=>m.c==c);if(!A.length)continue;const all=S.m.filter(m=>m.c==c),dn=all.filter(m=>S.done[m.id]).length,mn=all.reduce((a,m)=>a+m.ca,0),h=S.sg<9&&c>S.sg;
o+=`<section style="margin:0"><div class="chh"><span class="n mu">CH ${c}</span><h2 class="${h?'blur':''}">${CT[c]}</h2><span class="n mu">${dn}/${all.length} · ${mn} min</span></div>`+A.map(m=>`<div class="mr ${S.done[m.id]?'done':''} ${m.mis?'nr':''} ${m.imp==1?'k':''}"><input type="checkbox" aria-label="Done" ${S.done[m.id]?'checked':''} ${h?'disabled':''} onchange="S.done[${m.id}]=this.checked;save();go()"><div class="mt ${h?'blur':''}"><b>${E(m.t)}</b>${m.mis?`<span class="nrt">${I.flag}No return</span>`:''}<p>${E(m.why)}</p></div><div class="mm ${h?'blur':''}"><span class="imp">${IMP[m.imp]}</span><span class="n">${m.ca}<u>min</u></span><span class="n">${m.sp}<u>fast</u></span></div><button class="ib" aria-label="Edit mission" ${h?'disabled':''} onclick="om(${m.id})">${I.ed}</button></div>`).join('')+'</section>'}
$('#list').innerHTML=o||'<p class="empty">Nothing on the board matches. Loosen the filters, or add a job of your own.</p>'}
function om(id){const m=id!=null?S.m.find(x=>x.id==id):{c:S.fc||1,t:'',ca:30,sp:18,imp:3,why:'',mis:0};
$('#mb').innerHTML=`<h3>${id!=null?'Edit':'Add'} mission</h3><label>Title</label><input id="mt" value="${E(m.t)}"><label>Chapter</label><select id="mc">${[1,2,3,4,5].map(i=>`<option ${m.c==i?'selected':''}>${i}</option>`).join('')}</select><div class="row"><div class="cell"><label>Casual min</label><input id="ma" type="number" value="${m.ca}"></div><div class="cell"><label>Speedrun min</label><input id="ms" type="number" value="${m.sp}"></div></div><label>Story importance</label><select id="mi">${IMP.map((x,i)=>`<option value="${i}" ${m.imp==i?'selected':''}>${x}</option>`).join('')}</select><label>Why it matters</label><textarea id="mw" rows="3">${E(m.why)}</textarea><label><input type="checkbox" id="mm" ${m.mis?'checked':''}> Missable / point of no return</label><div class="row" style="margin-top:14px"><button class="pri" onclick="sm(${id??'null'})">Save</button><button onclick="cm()">Cancel</button>${id!=null?`<button class="x" onclick="dm(${id})">Delete</button>`:''}</div>`;$('#md').style.display='flex'}
const cm=()=>$('#md').style.display='none';
function sm(id){const o={c:+$('#mc').value,t:$('#mt').value.trim()||'Untitled',ca:+$('#ma').value||0,sp:+$('#ms').value||0,imp:+$('#mi').value,why:$('#mw').value,mis:$('#mm').checked?1:0};if(id==null)S.m.push({id:Date.now(),...o});else Object.assign(S.m.find(x=>x.id==id),o);S.m.sort((a,b)=>a.c-b.c);cm();go()}
function dm(id){S.m=S.m.filter(x=>x.id!=id);cm();go()}
// ---- Tommy ----
const FLOW={1:'Chapter 1 is mostly Jason, easing you in with small jobs and odd favors while Lucia’s side builds toward her release. Don’t rush it: poke around, learn the roads, and stack some cash.',2:'Chapter 2 is Lucia’s show, set around Port Gellhorn. Lighter everyday missions, new faces, and Jason rejoins near the end. Do your errands before you hit the chapter finale.',3:'Chapter 3 is the big one: Vice City proper, and you two run together and can switch between us. Longest chapter, so budget your time and cash.',4:'Chapter 4: you’re building your own operation around Ocean Beach. Busier, bigger, and the pressure ramps up toward a major showdown.',5:'Chapter 5 is short and intense. Top off cash, ammo and rides before you start, because the story only moves one way.'};
const cap=()=>S.sg>=9?5:S.sg;
const gt=(n,t)=>c=>c>=n?t:'That’s past where your Spoiler Guard is set, so I’m keeping it zipped. Raise the guard to Chapter '+n+' and I’ll fill you in.';
const KB=[[/check.?in|room key|starlet.*room|room.*starlet/,gt(1,'Room check-ins: when you’re holed up at the Starlet Motel, log which rooms and collectibles you’ve hit in Field Notes, and sweep the rest before a chapter finale. Keep the tab in the Cash tab so it doesn’t sneak up on you. General tips, so confirm in-game.')],
[/pacing|how long|rush|slow down|too fast/,gt(2,'Port Gellhorn pacing: Chapter 2 is the breather chapter, mostly errands and everyday jobs with Lucia, so don’t sprint. Loop back for side stuff and cash, then hit the finale when your pockets and ride are ready.')],
[/first free|first registration|save.*first|which (car|ride).*regist/,gt(1,'Your first free registration: hold it. Use it on the first high-value untracked ride you’d actually keep, not a junker. Tag it “Untracked gem” in Garage so you don’t burn the slot by accident.')],
[/gang hit|gang op|street op|store hit|stores? or banks?|stores? vs/,gt(1,'Street and gang ops plus store hits are your early bread and butter: quick, lower heat, smaller payouts. Banks need gear, a crew and a clean getaway, so hold them until you’ve got a buffer and a plan. Mark your best targets in Heists.')],
[/port gellhorn|electronic tag|ankle/,c=>c>=2?'Port Gellhorn is where Mami starts over, tagged and watching her step. Keep heat low, run the small errands, meet the locals, and don’t stack trouble you’ll have to answer for before the chapter wraps.':'Port Gellhorn? That’s a Chapter 2 story, amigo. Raise your Spoiler Guard to Chapter 2 and I’ll walk you through it.'],
[/starlet|motel|check.?in|room|collectible/,c=>'Motel life: track the tab in Cash, and jot room check-ins and collectibles in Field Notes. Sweep them before a chapter finale, because the world shifts after and I can’t promise the same access. I’m going on general rules, so confirm in-game.'],
[/free regist|early regist|registration slot|save.*regist/,c=>'Free registration is gold: spend it on the first high-value untracked ride you’ll really keep, never a junker. Flip the junkers, scrub tracked ones before keeping. Use the Garage “Tracked” and “Keepers” filters.'],
[/marked|bills|bank (or|vs) store|store (or|vs) bank/,c=>'Banks vs stores: stores are quick, low-heat and small. Banks pay more but want gear, a crew and a clean getaway. If the game flags marked bills, treat bank cash as hot until it’s clean and don’t spend it all at once. Early on, stick to stores and street ops.'],
[/vice city|big city/,c=>c>=3?'Vice City runs hotter: more cops, more witnesses, more ways to get clipped. Know your exits, keep a clean ride stashed, and save before big moves.':'Vice City’s further down the road. Raise your Spoiler Guard to Chapter 3 and I’ll talk it through.'],
[/missable|point of no return|before (moving|i leave|leaving)|chapter (end|change)/,c=>`Mami always says check the exits before you walk out. Every chapter ends on a flagged finale in your Campaign tab. The world shifts between chapters (new areas, new contacts), so finish side stuff, collectibles and shopping first. ${c<5?'Then save and move on.':'This is the last stretch: no second pass after.'}`],
[/cash|money|buck|broke|score|rich/,c=>`Money talk. ${c<2?'Early on, stick to small low-heat scores and keep rent-and-repairs money in your pocket.':c<4?'Pick jobs where payout beats heat, and keep a buffer for lawyers and rides.':'You’re running real operations now: keep a reserve before every big move.'} Log every dollar in the Cash tab so the tab never sneaks up on you.`],
[/track|regist|vin|chop|plate/,c=>'Trackers 101: a tracked ride gets you found, so check before you keep it. Don’t burn a free registration on a junker; save it for a high-value untracked ride. Scrub and respray at a chop shop when needed. Log it all in Garage. Check in-game text for the exact rules.'],
[/heat|wanted|cops|police|shake|lose/,c=>'Heat plan: break line of sight, swap vehicle and clothes, get off the main roads, then hide until the search cools. Don’t cruise past cops mid-search. Cheat sheet’s in Tools.'],
[/rob|heist|bank|store|vault|jewel|hit/,c=>`Hit or skip? Weigh payout against heat and prep (gear, getaway ride, cash cushion). ${c<3?'Stay small until you’ve got a clean ride and a plan.':'You’ve got the crew now, so plan the exit before the entrance.'} Rank your targets in the Heists tab.`],
[/ride|car|vehicle|garage|wheels/,c=>'Rides: log what you find with where you saw it and whether it’s a keeper or a flip. Trunk space helps with loot, off-road helps with escapes. You can’t have both, so choose your priority.'],
[/chapter|story|next|what now|flow|where/,c=>FLOW[c]],
[/^(hi|hey|yo|sup|hello)\b|who are/,c=>'Tommy here, Lucia’s kid, and I know every shortcut. Ask me about cash, missables, trackers, heat, hits or rides.']];
const Q=['Any missables before moving on?','Fastest way to make cash right now?','How do trackers & registrations work?','Is a bank or store hit worth it here?','What’s the flow of this chapter?','How do I shake the cops?'];
V.Tommy=()=>`<h3>Tommy <span>Lucia’s kid. Burner line, no spoilers past your guard.</span></h3><div class="strip"><div><small>Guard</small><b>${S.sg>=9?'ALL':'CH '+S.sg}</b></div><label class="grow"><small>Situation</small><input placeholder="e.g. Starlet Motel, low cash, need a ride" value="${E(S.ctx)}" onchange="S.ctx=this.value;save()"></label><details class="key"><summary>API key</summary><input type="password" placeholder="Optional" value="${E(S.key)}" onchange="S.key=this.value;save()"><small class="mu" style="text-transform:none;letter-spacing:0">Live replies only work when this file runs locally. Offline answers are general tips, not verified game data.</small></details></div>
<div class="qp">${Q.map(c=>`<button onclick="ask(this.textContent)">${c}</button>`).join('')}</div>
<div id="chat" class="feed">${S.chat.map(m=>`<div class="ln ${m.r}"><span class="who">${m.r=='u'?'YOU':'TOMMY'}</span><p>${E(m.t)}</p></div>`).join('')||'<div class="ln t"><span class="who">TOMMY</span><p>Line’s open. What’s the move?</p></div>'}</div>
<div class="send"><input id="ci" placeholder="Message Tommy" onkeydown="if(event.key=='Enter')ask()"><button class="pri" onclick="ask()">Send</button></div>`;
async function ask(q){q=q||$('#ci').value.trim();if(!q)return;S.chat.push({r:'u',t:q});let a;
if(S.key){try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:600,system:`You are Tommy, Lucia's street-smart kid and loyal crew sidekick in GTA VI. Lively, short answers. No spoilers beyond ${S.sg>=9?'any chapter':'Chapter '+S.sg}. Situation: ${S.ctx||'unknown'}. Never invent game facts; say when unsure.`,messages:S.chat.slice(-8).map(m=>({role:m.r=='u'?'user':'assistant',content:m.t}))})});a=(await r.json()).content[0].text}catch(e){}}
if(!a){const k=KB.find(x=>x[0].test(q.toLowerCase()));a=(S.ctx?`Right now: ${S.ctx}. `:'')+(k?k[1](cap()):'Mami didn’t teach me that one. Try cash, missables, trackers, heat, hits, rides or the chapter flow.')}
S.chat.push({r:'t',t:a});go()}
// ---- ledgers ----
const opt=(a,v)=>(!v||a.includes(v)?a:[...a,v]).map(x=>`<option ${x==v?'selected':''}>${E(x)}</option>`).join('');
const chips=(k,a)=>`<div class="seg2">${a.map(x=>`<button class="${S[k]==x[0]?'on':''}" onclick="S.${k}='${x[0]}';go()">${x[1]}</button>`).join('')}</div>`;
const pre=(k,a)=>a.map((x,i)=>`<button onclick="pa('${k}',${i})">${x[0]}</button>`).join('');
const GP=[['+ Keeper',['','None','','Keeper','']],['+ Quick flip',['','Standard','','Flip','']],['+ Untracked gem',['','None','','Keeper','Use an early free registration here']],['+ Tracked (scrub it)',['','Advanced','','Flip','Scrub VIN / chop shop before keeping']]];
const CP=[['+ Mission payout',['Mission payout','','']],['+ Robbery score',['Robbery score','','']],['+ Sold a car',['Sold a car','','']],['− Rent / motel tab',['Rent / motel tab','-','']],['− Ammo & gear',['Ammo & gear','-','']],['− Registration',['Registration','-','']],['− Repairs / respray',['Repairs / respray','-','']]];
function pa(k,i){S[k].push({v:[...(k=='g'?GP:CP)[i][1]],d:0});go()}
const fld=(lab,h)=>`<label class="f"><small>${lab}</small>${h}</label>`;
const inp=(k,i,j,ph,live)=>`<input placeholder="${ph}" value="${E(S[k][i].v[j])}" ${live?`inputmode="decimal" style="text-align:right" oninput="S.${k}[${i}].v[${j}]=this.value;cu();save()"`:`onchange="S.${k}[${i}].v[${j}]=this.value;save()"`}>`;
const sel=(k,i,j,a)=>`<select onchange="S.${k}[${i}].v[${j}]=this.value;save()">${opt(a,S[k][i].v[j])}</select>`;
const lrow=(k,i,cls,body)=>`<div class="lr ${cls} ${S[k][i].d?'done':''}"><input type="checkbox" aria-label="Done" ${S[k][i].d?'checked':''} onchange="S.${k}[${i}].d=this.checked;go()">${body}<button class="ib x" aria-label="Delete row" onclick="S.${k}.splice(${i},1);go()">${I.x}</button></div>`;
const lhead=(cls,a)=>`<div class="lh ${cls}"><span></span>${a.map(x=>`<small>${x}</small>`).join('')}<span></span></div>`;
V.Garage=()=>{const f=S.gf,ok=r=>f=='all'||(f=='keep'?/^keep/i.test(r.v[3]):f=='flip'?/flip/i.test(r.v[3]):f=='trk'?r.v[1]&&r.v[1]!='None':!r.d);
return `<h3>WAiNK check <span>Every ride you’ve clocked in Leonida</span></h3><div class="ctl">${pre('g',GP)}</div><div class="ctl">${chips('gf',[['all','All'],['keep','Keepers'],['flip','Flips'],['trk','Tracked'],['open','Open']])}</div>${lhead('','Vehicle|Tracker|Status|Spotted|Notes'.split('|'))}`+(S.g.map((r,i)=>ok(r)?lrow('g',i,'',fld('Vehicle',inp('g',i,0,'Vehicle'))+fld('Tracker',sel('g',i,1,['None','Standard','Advanced']))+fld('Keeper / flip',sel('g',i,3,['Keeper','Flip','Undecided']))+fld('Where spotted',inp('g',i,2,'Where spotted'))+fld('Notes',inp('g',i,4,'Tracker, registration, chop shop'))):'').join('')||'<p class="empty">Nothing in the lot yet. Log what you spot around Leonida, or tap a preset to start.</p>')};
const gnet=()=>{let i=0,o=0;S.c.forEach(r=>{const a=parseFloat(r.v[1])||0;a>0?i+=a:o+=a});return[i,o,i+o]};
const nt=()=>{const[i,o,n]=gnet();return `<div><small>Cash in</small><b>$${i.toLocaleString()}</b></div><div><small>Out / owed</small><b class="alt">$${Math.abs(o).toLocaleString()}</b></div><div class="net"><small>Net balance</small><b class="${n<0?'alt':''}">${n<0?'−':''}$${Math.abs(n).toLocaleString()}</b></div>`};
function cu(){$('#net').innerHTML=nt()}
V.Cash=()=>{const am=r=>parseFloat(r.v[1])||0,ok=r=>S.cf=='all'||(S.cf=='in'?am(r)>0:S.cf=='out'?am(r)<0:!r.d);
return `<div class="bal" id="net">${nt()}</div><h3>BuckMe <span>Cash in, cash out, and what you owe the motel</span></h3><div class="ctl">${pre('c',CP)}</div><div class="ctl">${chips('cf',[['all','All'],['in','Cash in'],['out','Out'],['open','Open']])}${chips('cs',[['new','Newest'],['amt','Biggest']])}</div>${lhead('g-c',['Entry','Amount (± $)','Note'])}`+(S.c.map((r,i)=>({r,i})).filter(x=>ok(x.r)).sort((x,y)=>S.cs=='amt'?Math.abs(am(y.r))-Math.abs(am(x.r)):y.i-x.i).map(({i})=>lrow('c',i,'g-c',fld('Entry',inp('c',i,0,'Label'))+fld('Amount (± $)',inp('c',i,1,'± $',1))+fld('Note',inp('c',i,2,'Note')))).join('')||'<p class="empty">Pockets are empty. Add a payout or a tab and watch the balance move.</p>')};
V.Heists=()=>`<h3>Scores <span>Plan the job before the lights go on</span></h3><div class="ctl"><button onclick="S.h.push({v:['','','','',''],d:0});go()">${I.add} Add target</button><small class="mu">Tiers are templates: fill in real payouts and requirements as you find them.</small></div>${lhead('g-h',['Target','Type','Requirements','Heat risk','Payout'])}`+(S.h.map((r,i)=>lrow('h',i,'g-h',fld('Target',inp('h',i,0,'Target'))+fld('Type',inp('h',i,1,'Type'))+fld('Requirements',inp('h',i,2,'Gear, crew, story gate'))+fld('Heat risk',inp('h',i,3,'Heat'))+fld('Payout',inp('h',i,4,'Payout')))).join('')||'<p class="empty">No scores planned. Add a target and size up the heat before you roll.</p>');
V.Tools=()=>{const el=S.T.acc+(S.T.run?Date.now()-S.T.st:0),dn=S.m.filter(m=>S.done[m.id]),cs=dn.reduce((a,m)=>a+m.ca,0),ss=dn.reduce((a,m)=>a+m.sp,0);
return `<div class="two"><section><h3>Time on the street</h3><div id="timer" class="big n">${new Date(el).toISOString().substr(11,8)}</div><div class="row"><button class="pri" onclick="tg()">${S.T.run?'Pause':'Start'}</button><button onclick="es()">End session</button></div>${pace(el,cs,ss,dn.length)}</section>
<section><h3>Heat <span>Shaking the law (general tactics)</span></h3><ol class="steps"><li>Break line of sight, then keep moving.</li><li>Swap vehicle and clothes to reset descriptions.</li><li>Leave main roads and hide until the search clears.</li><li>Don’t drive past cops mid-search.</li><li>Save before big moves.</li></ol></section></div>
<section><h3>Leonida field notes</h3><div class="row"><input id="nt" placeholder="Where the car is parked, who to check on, goal for next session" onkeydown="if(event.key=='Enter')an()"><button class="pri" onclick="an()">Add note</button></div>${S.n.map((x,i)=>`<div class="nl"><small>${E(x[0])}<br>${E(x[1])}</small><span>${E(x[2])}</span><button class="ib x" aria-label="Delete note" onclick="S.n.splice(${i},1);go()">${I.x}</button></div>`).join('')||'<p class="empty">No notes yet. Jot where you parked, who to check on, what to hit next session.</p>'}</section>
<section><h3>Stash & restore</h3><textarea id="bk" rows="4" style="width:100%" placeholder="Export fills this box. Paste a backup here and Import to restore."></textarea><div class="row" style="margin-top:8px"><button onclick="$('#bk').value=JSON.stringify(S)">Export</button><button onclick="try{S={...S,...JSON.parse($('#bk').value)};go()}catch(e){alert('Invalid backup')}">Import</button></div><div class="danger row"><button class="x" id="rdb" onclick="rd()">Reset to defaults</button><small class="mu" style="text-transform:none;letter-spacing:0">Clears progress, edits, lists, notes and chat. API key and Spoiler Guard stay.</small></div></section>`};
function an(){const t=$('#nt').value.trim();if(!t)return;S.n.unshift([new Date().toLocaleString(),S.fc?'Ch '+S.fc:'General',t]);go()}
function es(){const t=(S.T.tot||0)+S.T.acc+(S.T.run?Date.now()-S.T.st:0);S.T={run:0,st:0,acc:0,tot:t};go()}
function pace(el,cs,ss,n){const ses=Math.floor(el/6e4),tot=Math.floor(((S.T.tot||0)+el)/6e4),r=cs?Math.round(tot/cs*100):0;
return `<dl class="dl"><dt>Session<em>Actual</em></dt><dd class="n">${ses} min</dd><dt>Total played<em>Actual</em></dt><dd class="n">${tot} min</dd><dt>${n} missions done, casual<em>Estimate</em></dt><dd class="n">${cs} min</dd><dt>${n} missions done, speedrun<em>Estimate</em></dt><dd class="n">${ss} min</dd></dl><div class="pbar"><i style="width:${Math.min(100,r)}%"></i></div><small class="mu" style="text-transform:none;letter-spacing:0">${cs?`Total played is ${r}% of the casual estimate. It also counts driving, side activities and idle time, so going over is normal. End session banks this session into the total.`:'Tick off missions in Campaign to compare.'}</small>`}
let rc=0;function rd(){const b=$('#rdb');if(!rc){rc=1;b.textContent='Tap again to confirm reset';setTimeout(()=>{rc=0;if($('#rdb'))$('#rdb').textContent='Reset to defaults'},4000);return}rc=0;const k=S.key,g=S.sg;S=fresh(g);S.key=k;S.tab='Tools';save();go()}
function tg(){if(S.T.run){S.T.acc+=Date.now()-S.T.st;S.T.run=0}else{S.T.st=Date.now();S.T.run=1}go()}
setInterval(()=>{if(S.tab=='Tools'&&S.T.run&&$('#timer'))$('#timer').textContent=new Date(S.T.acc+Date.now()-S.T.st).toISOString().substr(11,8)},500);
go();
</script></body></html>
